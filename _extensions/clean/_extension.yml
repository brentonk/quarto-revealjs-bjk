title: clean
author: Grant McDermott
version: 1.2.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    revealjs:
      theme: [default, clean.scss]
      menu:
        side: left
      slide-number: true
      date-format: long
      code-line-numbers: false
      html-math-method:
        method: mathjax
        url: "https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"
      include-before-body:
        - text: |
            <script src="mathjax-config.js"></script>
      format-resources:
        - mathjax-config.js
        - fonts/source-serif-4-roman.woff2
        - fonts/source-serif-4-italic.woff2
        - fonts/source-sans-3-roman.woff2
        - fonts/source-sans-3-italic.woff2
        - fonts/iosevka-regular.woff2
        - fonts/iosevka-bold.woff2
        - fonts/iosevka-italic.woff2
